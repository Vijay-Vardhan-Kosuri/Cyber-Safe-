{% extends 'base.html' %}

{% block title %}Initiate Assessment — CyberSafe{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 700px;">
  <div class="cs-card p-4">
    <h3 class="text-white fw-bold mb-3"><i class="bi bi-clipboard-plus text-cyan me-2"></i> Launch Assessment</h3>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-white">Assessment Title</label>
        {{ form.title }}
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Select Framework Template</label>
        {{ form.template }}
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Assign To Employee / Lead</label>
        {{ form.assigned_to }}
      </div>
      <div class="mb-4">
        <label class="form-label text-white">Scope & Notes (Optional)</label>
        {{ form.notes }}
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'assessments:assessment_list' %}" class="btn btn-cyber-outline">Cancel</a>
        <button type="submit" class="btn btn-cyber-cyan">Create & Assign Assessment</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
