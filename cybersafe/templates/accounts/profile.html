{% extends 'base.html' %}

{% block title %}My Profile — CyberSafe{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 640px;">
  <div class="cs-card p-4">
    <h3 class="text-white fw-bold mb-3"><i class="bi bi-person-gear text-cyan me-2"></i> Profile Settings</h3>
    <form method="post">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label text-white">First Name</label>
          {{ form.first_name }}
        </div>
        <div class="col-6">
          <label class="form-label text-white">Last Name</label>
          {{ form.last_name }}
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Job Title</label>
        {{ form.job_title }}
      </div>
      <div class="mb-4">
        <label class="form-label text-white">Phone</label>
        {{ form.phone }}
      </div>
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-cyber-cyan">Save Profile Updates</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
