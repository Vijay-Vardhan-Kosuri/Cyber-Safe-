{% extends 'base.html' %}

{% block title %}Create Framework — CyberSafe{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
  <div class="cs-card p-4">
    <h3 class="text-white fw-bold mb-3"><i class="bi bi-plus-square-fill text-cyan me-2"></i> Author Framework</h3>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-white">Framework Title</label>
        {{ form.title }}
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label text-white">Version</label>
          {{ form.version }}
        </div>
        <div class="col-md-6">
          <label class="form-label text-white">Target Audience</label>
          {{ form.audience }}
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label text-white">Description & Framework Scope</label>
        {{ form.description }}
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'checklists:template_list' %}" class="btn btn-cyber-outline">Cancel</a>
        <button type="submit" class="btn btn-cyber-cyan">Publish Framework</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
